appId: com.avatarcode.app
productName: AvatarCode
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - src/i18n/locales/**/*
  - package.json
  - "!node_modules/**/*"
  - "!tests/**/*"
  - "!.monkeycode/**/*"
  - "!openspec/**/*"
  - "!.trae/**/*"
  - "!.git/**/*"
asar: true
win:
  target:
    - target: dir
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
