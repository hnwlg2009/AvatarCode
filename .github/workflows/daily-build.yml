name: Daily Build

on:
  # 每日UTC 02:00构建
  schedule:
    - cron: '0 2 * * *'
  # 手动触发
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  daily-build:
    name: 🏗️ Daily Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci --frozen-lockfile
        
      - name: 🔍 Lint
        run: npm run lint
        
      - name: 🔍 Type Check
        run: npm run typecheck
        
      - name: 🧪 Tests
        run: npm test
        
      - name: 🏗️ Build
        run: npm run build
        
      - name: 📊 Build Stats
        run: |
          echo "## 构建统计" >> $GITHUB_STEP_SUMMARY
          echo "- 前端构建产物大小：$(du -sh dist/ | cut -f1)"
          echo "- TypeScript 错误：0"
          echo "- 测试通过率：100%" >> $GITHUB_STEP_SUMMARY
          
      - name: 🔔 Notify on Failure
        if: failure()
        run: |
          echo "每日构建失败，请检查！"
          # 可以集成通知渠道

