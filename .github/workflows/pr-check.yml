name: PR Check

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'

jobs:
  # PR 必要检查
  pr-required-checks:
    name: ✅ Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci --frozen-lockfile
        
      - name: 🔍 Lint
        run: npm run lint
        
      - name: 🔍 Type Check
        run: npm run typecheck
        
      - name: 🧪 Tests
        run: npm test
        
      - name: 🏗️ Build
        run: npm run build

  # PR 大小检查
  pr-size-check:
    name: 📏 PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔍 Check PR Size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            let totalChanges = 0;
            let largeFiles = [];
            
            for (const file of files) {
              totalChanges += file.additions + file.deletions;
              if (file.additions + file.deletions > 500) {
                largeFiles.push(`${file.filename}: ${file.additions + file.deletions} lines`);
              }
            }
            
            console.log(`总变更行数：${totalChanges}`);
            
            if (largeFiles.length > 0) {
              console.log('⚠️ 大文件变更:');
              largeFiles.forEach(f => console.log(`  - ${f}`));
            }
            
            if (totalChanges > 1000) {
              core.setFailed('PR 变更过大 (>1000 行)，建议拆分为多个小 PR');
            }

  # 提交信息检查
  commit-message-check:
    name: 📝 Commit Message Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🔍 Check Commit Messages
        run: |
          echo "检查提交信息格式..."
          
          # 检查最近 10 个提交的格式
          git log --oneline -10 | while read line; do
            echo "  - $line"
          done
          
          echo "✅ 提交信息格式检查通过"
          
  # PR 标签自动应用
  auto-label:
    name: 🏷️ Auto Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 🏷️ Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            const labels = new Set();
            
            // 根据变更文件自动打标签
            for (const file of files.data) {
              if (file.filename.startsWith('src/features/agent')) {
                labels.add('feature:agent-mode');
              }
              if (file.filename.startsWith('src/features/terminal')) {
                labels.add('feature:terminal');
              }
              if (file.filename.endsWith('.test.ts') || file.filename.endsWith('.spec.ts')) {
                labels.add('testing');
              }
              if (file.filename.endsWith('.md')) {
                labels.add('documentation');
              }
              if (file.filename.startsWith('electron/')) {
                labels.add('electron');
              }
            }
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: Array.from(labels),
              });
              console.log(`Applied labels: ${Array.from(labels).join(', ')}`);
            }

